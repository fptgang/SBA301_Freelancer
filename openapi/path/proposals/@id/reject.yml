put:
  summary: Reject a proposal
  operationId: rejectProposal
  security:
    - bearerAuth: []
  parameters:
    - name: proposalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: rejectReason
      in: query
      required: false
      schema:
        type: string    
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            $ref: '../../../model/proposal.yml#/ProposalDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'