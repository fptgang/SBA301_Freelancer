get:
  summary: Get a contract by ID
  operationId: getContractById
  security:
    - bearerAuth: []
  parameters:
    - name: contractId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/contract.yml#/ContractDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

delete:
  summary: Delete an existing contract
  operationId: deleteContract
  security:
    - bearerAuth: []
  parameters:
    - name: contractId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'
