get:
  summary: count projects in category by ID
  operationId: countProjectInCategoryById
  security:
    - bearerAuth: []
  parameters:
    - name: projectCategoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            $ref: '../../../model/stats/project-in-category.yml#/ProjectInCategoryDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'
