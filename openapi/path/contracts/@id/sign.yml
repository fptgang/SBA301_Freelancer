put:
  summary: Sign a contract
  operationId: signContract
  security:
    - bearerAuth: []
  parameters:
    - name: contractId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            $ref: '../../../model/contract.yml#/ContractDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'