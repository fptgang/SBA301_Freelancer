get:
  summary: Get files for an entity
  operationId: getEntityFiles
  security:
    - bearerAuth: []
  parameters:
    - name: entityType
      in: path
      required: true
      schema:
        type: string
        enum: [project, proposal, message, milestone]
      description: The type of entity
    - name: entityId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the entity
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/file.yml#/FileDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

post:
  summary: Upload a file for an entity
  operationId: uploadEntityFile
  security:
    - bearerAuth: []
  parameters:
    - name: entityType
      in: path
      required: true
      schema:
        type: string
        enum: [project, proposal, message, milestone]
      description: The type of entity
    - name: entityId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the entity
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
            description:
              type: string
            isVisible:
              type: boolean
              default: true
          required:
            - file
  responses:
    '201':
      description: File uploaded successfully
      content:
        application/json:
          schema:
            $ref: '../model/file.yml#/FileDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'