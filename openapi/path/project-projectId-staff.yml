put:
  summary: Staff join an existing project
  operationId: joinProject
  security:
    - bearerAuth: []
  parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'
delete:
  summary: Staff leave an existing project
  operationId: leaveProject
  security:
    - bearerAuth: []
  parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'