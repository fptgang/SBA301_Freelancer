post:
  summary: Submit the work
  operationId: submitMilestoneWork
  security:
    - bearerAuth: []
  parameters:
    - name: milestoneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    description: File to upload
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            blobs:
              type: array
              items:
                type: string
                format: binary
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            $ref: '../../../model/milestone.yml#/MilestoneDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'