post:
  summary: Confirm the work
  operationId: confirmMilestoneWork
  security:
    - bearerAuth: []
  parameters:
    - name: milestoneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            $ref: '../../../model/milestone.yml#/MilestoneDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'