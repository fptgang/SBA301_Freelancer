put:
  summary: Accept an existing project's proposal
  operationId: acceptProjectProposal
  security:
    - bearerAuth: []
  parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: proposalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'
delete:
  summary: Reject an existing project
  operationId: rejectProjectProposal
  security:
    - bearerAuth: []
  parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: proposalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'