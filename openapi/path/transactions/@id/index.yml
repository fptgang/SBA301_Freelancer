get:
  summary: Get an transaction by ID
  operationId: getTransactionById
  security:
    - bearerAuth: []
  parameters:
    - name: transactionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            $ref: '../../../model/transaction.yml#/TransactionDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'