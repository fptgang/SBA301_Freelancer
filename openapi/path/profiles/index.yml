get:
  summary: Get a list of profiles
  operationId: getProfiles
  security:
    - bearerAuth: []
  parameters:
    - $ref: '../../param/pageable.yml#/Pageable'
    - $ref: '../../param/filter.yml#/Filter'
    - $ref: '../../param/search.yml#/Search'
  responses:
    '200':
      description: The operation was success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../component/page.yml#/Page'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../../model/profile.yml#/ProfileDto'
    '400':
      description: The operation was failed
      content:
        application/json:
          schema:
            $ref: '../../component/error.yml#/ErrorResponse'
post:
  summary: Create a profile
  operationId: createProfile
  security:
    - bearerAuth: []
  requestBody:
    description: Profile to create
    required: true
    content:
      application/json:
        schema:
          $ref: '../../model/request/profile-form.yml#/ProfileFormDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../../model/profile.yml#/ProfileDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../component/error.yml#/ErrorResponse'