get:
  summary: Get a report by ID
  operationId: getReportById
  security:
    - bearerAuth: []
  parameters:
    - name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../../../model/report.yml#/ReportDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'

put:
  summary: Update an existing report
  operationId: updateReport
  security:
    - bearerAuth: []
  parameters:
    - name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    description: Report to update
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../model/report.yml#/ReportDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../../../model/report.yml#/ReportDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'

