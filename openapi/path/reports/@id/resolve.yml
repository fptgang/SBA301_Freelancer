put:
  summary: Resolve an existing report
  operationId: resolveReport
  security:
    - bearerAuth: []
  parameters:
    - name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    description: Report to resolve
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../model/request/solution.yml#/SolutionDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../../../model/report.yml#/ReportDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'

