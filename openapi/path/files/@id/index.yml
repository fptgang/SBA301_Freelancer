delete:
  summary: Delete an existing file
  operationId: deleteFile
  security:
    - bearerAuth: []
  parameters:
    - name: fileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'
