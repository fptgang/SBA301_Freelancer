put:
  summary: Update metadata of an existing file
  operationId: updateFile
  security:
    - bearerAuth: []
  parameters:
    - name: fileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    description: Metadata to update
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../../model/file-blob.yml#/FileBlobDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../../../model/file.yml#/FileDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'

delete:
  summary: Delete an existing file
  operationId: deleteFile
  security:
    - bearerAuth: []
  parameters:
    - name: fileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../../component/error.yml#/ErrorResponse'
