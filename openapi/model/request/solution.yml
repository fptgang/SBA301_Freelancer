# model/request/solution.yml
SolutionDto:
    type: object
    required:
        - solution
    properties:
        staffId:
            type: integer
            format: int64
        haveAction:
            type: boolean
        projectStatus:
            type: string
            enum: [CONTINUE, TERMINATE]
        transferDepositTo:
            type: string
            enum: [CLIENT, FREELANCER]
        solution:
            type: string
