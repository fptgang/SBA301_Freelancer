ProjectUpdateDto:
  type: object
  properties:
    projectCategoryId:
      type: integer
      format: int64
    title:
      type: string
    description:
      type: string
    startDate:
      type: string
      format: date-time
    minBudget:
      type: number
      format: double
    maxBudget:
      type: number
      format: double
    requiredSkills:
      type: array
      items:
        $ref: 'skill-set.yml#/SkillSetDto'
    milestones:
      type: array
      items:
        $ref: 'milestone-update.yml#/MilestoneUpdateDto'
