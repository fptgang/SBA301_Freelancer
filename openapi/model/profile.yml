ProfileDto:
  type: object
  properties:
    profileId:
      type: integer
      format: int64
    account:
      $ref: 'account.yml#/AccountDto'
    overview:
      type: string
    education:
      type: string
    phoneNumber:
      type: string
    language:
      type: string
    skills:
      type: array
      items:
        $ref: 'profile-skill.yml#/ProfileSkillDto'
    isVisible:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time