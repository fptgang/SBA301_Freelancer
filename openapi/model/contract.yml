ContractDto:
  type: object
  properties:
    contractId:
      type: integer
      format: int64
    proposal:
      $ref: 'proposal.yml#/ProposalDto'
    freelancer:
      $ref: 'account.yml#/AccountDto'
    projectId:
      type: integer
      format: int64
    budget:
      type: number
      format: double
    signedAt:
      type: string
      format: date-time
    terminatedAt:
      type: string
      format: date-time
    status:
      $ref: 'contract-status.yml#/ContractStatusDto'
    contractFile:
      $ref: 'file.yml#/FileDto'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time