ContractDto:
  type: object
  properties:
    contractId:
      type: integer
      format: int64
    proposalId:
      type: integer
      format: int64
    freelancerId:
      type: integer
      format: int64
    projectId:
      type: integer
      format: int64
    status:
      type: string
      enum: [UNSIGNED,SIGNED,TERMINATED]
    contractFile:
      $ref: 'file.yml#/FileDto'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time