ProposalDto:
  type: object
  properties:
    proposalId:
      type: integer
      format: int64
    projectId:
      type: integer
      format: int64
    freelancer:
      $ref: 'account.yml#/AccountDto'
    notes:
      type: string
    budget:
      type: number
      format: double
    status:
      $ref: 'proposal-status.yml#/ProposalStatusDto'
    contract:
      $ref: 'contract.yml#/ContractDto'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    files:
      type: array
      items:
        $ref: 'file.yml#/FileDto'