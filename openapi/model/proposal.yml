ProposalDto:
  type: object
  properties:
    proposalId:
      type: integer
      format: int64
    projectId:
      type: integer
      format: int64
    freelancerId:
      type: integer
      format: int64
    notes:
      type: string
    budget:
      type: number
      format: double
    status:
      type: string
      enum: [PENDING,EXPIRED,WITHDRAWN, ACCEPTED, REJECTED]
    contractId:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    files:
      type: array
      items:
        $ref: 'file.yml#/FileDto'