MilestoneDto:
  type: object
  properties:
    milestoneId:
      type: integer
      format: int64
    projectId:
      type: integer
      format: int64
    description:
      type: string
    title:
      type: string
    budgetRatio:
      type: number
      format: double
      minimum: 0
      maximum: 1
    deadline:
      type: string
      format: date-time
    status:
      type: string
      enum: [PENDING, TERMINATED, IN_PROGRESS, REVIEWING, FINISHED]
    isVisible:
      type: boolean
    deliverables:
      type: array
      items:
        $ref: 'file.yml#/FileDto'
    transactions:
      type: array
      items:
        $ref: 'transaction.yml#/TransactionDto'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time