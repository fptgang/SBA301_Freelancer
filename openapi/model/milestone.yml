MilestoneDto:
  type: object
  properties:
    milestoneId:
      type: integer
      format: int64
    projectId:
      type: integer
      format: int64
    description:
      type: string
    title:
      type: string
    budgetRatio:
      type: number
      format: double
      minimum: 0
      maximum: 1
    contractualBudget:
      type: number
      format: double
    deadline:
      type: string
      format: date-time
    status:
      $ref: 'milestone-status.yml#/MilestoneStatusDto'
    fundStatus:
      $ref: 'milestone-fund-status.yml#/MilestoneFundStatusDto'
    isVisible:
      type: boolean
    deliverables:
      type: array
      items:
        $ref: 'file.yml#/FileDto'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time