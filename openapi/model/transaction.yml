TransactionDto:
  type: object
  properties:
    transactionId:
      type: integer
      format: int64
    fromAccountId:
      type: integer
      format: int64
    toAccountId:
      type: integer
      format: int64
    amount:
      type: number
      format: double
    type:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, ESCROW_DEPOSIT, ESCROW_RELEASE, ESCROW_REFUND]
    status:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
    milestoneId:
      type: integer
      format: int64
    paymentMethod:
      type: string
      enum: [ VNPAY, INTERNAL_WALLET ]
    createdAt:
      type: string
      format: date-time