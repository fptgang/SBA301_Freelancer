TransactionDto:
  type: object
  properties:
    transactionId:
      type: integer
      format: int64
    fromAccount:
      $ref: 'account.yml#/AccountDto'
    toAccount:
      $ref: 'account.yml#/AccountDto'
    milestone:
      $ref: 'milestone.yml#/MilestoneDto'
    amount:
      type: number
      format: double
    type:
      $ref: 'transaction-type.yml#/TransactionTypeDto'
    status:
      $ref: 'transaction-status.yml#/TransactionStatusDto'
    paymentMethod:
      $ref: 'payment-method.yml#/PaymentMethodDto'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time