RegisterRequestDto:
  type: object
  properties:
    role:
      type: string
      enum: [CLIENT, FREELANCER]
    email:
      type: string
    password:
      type: string
    confirmPassword:
      type: string
    firstName:
      type: string
    lastName:
      type: string
    overview:
      type: string
    education:
      type: string
    phoneNumber:
      type: string
    language:
      type: string
    profileSkills:
      type: array
      items:
        $ref: '../profile-skill.yml#/ProfileSkillDto'




