MessageDto:
  type: object
  properties:
    messageId:
      type: integer
      format: int64
    sender:
      $ref: 'account.yml#/AccountDto'
    projectId:
      type: integer
      format: int64
    content:
      type: string
    isVisible:
      type: boolean
    files:
      type: array
      items:
        $ref: 'file.yml#/FileDto'
    createdAt:
      type: string
      format: date-time