spring.application.name=backend
spring.docker.compose.file=compose.yaml

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/hirable
spring.datasource.username=myuser
spring.datasource.password=verysecret

#hibernate
spring.jpa.hibernate.ddl-auto=update

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.syntax-highlight.theme=agate
springdoc.swagger-ui.try-it-out-enabled=true

#jwt
jwt.private.key=classpath:key.pem
jwt.public.key=classpath:certificate.pem

#test-container sql
spring.sql.init.mode=always

