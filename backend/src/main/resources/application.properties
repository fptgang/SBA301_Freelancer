#azure
spring.cloud.azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME}
spring.cloud.azure.storage.blob.connection-string=${AZURE_STORAGE_ACCOUNT_ENDPOINT}
spring.cloud.azure.storage.blob.sas-token=${AZURE_STORAGE_SAS_TOKEN}
spring.cloud.azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME}
spring.cloud.azure.storage.blob.account-key=${AZURE_STORAGE_ACCOUNT_KEY}

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8

spring.jackson.default-property-inclusion=non_null

#0: auto, create if not exists
#>0: pick the given account (must be ADMIN)
hirable.account.escrow.id=0
hirable.account.escrow.email=escrow@hirable.com
hirable.account.escrow.name=Escrow
hirable.account.escrow.password=1

# StartDate must be at least 3 days later (from the time of project creation)
hirable.project.min-project-start-delay=3

# The duration distance between milestones is at least 3 days (and up to 30 days)
hirable.milestone.min-duration-between=3
hirable.milestone.max-duration-between=30

# The maximum amount of milestones is 10
hirable.milestone.max-amount=10

# Client can request to terminate a project at least 2 days before the current milestone deadline
hirable.project.termination-notice-period=2

# Freelancer can apply proposals at least 1 day before project startDate
# and Freelancer must sign the contract in 1 day before project startDate
hirable.proposal.application-cutoff-duration=1

#Currency Exchange Rate From Fixer.io
currency.api.url=http://data.fixer.io/api/latest
currency.api.key=db20d85cc27fc92d1c433fba8e0499f5

hirable.enable-sending-mail=false
